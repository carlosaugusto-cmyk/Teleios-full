<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F2B5C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0077C8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cross" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F5A800;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E89C13;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="250" fill="url(#bg)" />
  <!-- Cross symbol -->
  <g transform="translate(256, 256)">
    <!-- Vertical bar -->
    <rect x="-28" y="-90" width="56" height="180" rx="8" fill="url(#cross)" />
    <!-- Horizontal bar -->
    <rect x="-70" y="-16" width="140" height="56" rx="8" fill="url(#cross)" />
  </g>
  <!-- Tagline text -->
  <text x="256" y="430" font-family="Georgia, serif" font-size="24" font-weight="bold" fill="#F5A800" text-anchor="middle" font-style="italic">Cristo é meu Salvador</text>
</svg>