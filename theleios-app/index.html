<!DOCTYPE html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Teleios — Devocionais & Estudos</title>

    <!-- Escudo contra bug interno do Chrome DevTools (Soft Navigation / reportAllChanges) -->
    <script>
      (function() {
        function isSoftNavBug(err, msg) {
          var m = String(msg || err && err.message || '');
          var s = String(err && err.stack || '');
          return m.indexOf("reading 'startTime'") !== -1 ||
                 m.indexOf('reportAllChanges') !== -1 ||
                 s.indexOf('reportAllChanges') !== -1;
        }
        window.addEventListener('error', function(e) {
          if (isSoftNavBug(e.error, e.message)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          if (isSoftNavBug(e.reason, e.reason && e.reason.message)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>

    <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="mask-icon" href="/icons/safari-pinned-tab.svg" color="#0F2B5C" />
  </head>
