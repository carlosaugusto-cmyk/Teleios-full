[package]
name = "gateway-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.36", features = ["full"] }
axum = "0.7.4"
tower = "0.4.13"
tower-http = { version = "0.5.2", features = ["trace", "cors"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
governor = "0.6.3"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = "0.3"
